# Baseline CI for a small/single-package Python repo — enforces the ruff
# format/lint and pytest hooks from the pre-commit baseline
# (.pre-commit-config.yaml) in CI, since pre-commit itself only runs locally.
# The other pre-commit hooks (trailing-whitespace, end-of-file-fixer,
# check-yaml/toml/json, check-added-large-files, debug-statements, pyupgrade)
# are not enforced here and run nowhere else either.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    # Runner pool is switchable per repo without editing this file: set the
    # CI_RUNNERS repo variable to a JSON array of runner labels — e.g.
    # ["self-hosted","linux","x64"] — to route CI off GitHub-hosted runners
    # when their minutes are unavailable (on a private repo, exhausting the
    # free tier makes every job refuse to start). Unset means ubuntu-latest.
    # See dev-standards' README § CI runners for the commands.
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

  test-python:
    name: Tests (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests
        run: uv run pytest
