[project]
name = "claude-web-backup"
version = "0.1.0"
description = "Nightly local backup of Claude.ai projects and conversations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-client",
    "logger",
]

[tool.uv.sources]
# Git sources, not local paths: the old absolute paths only resolved on this machine.
# A CI workflow that depends on this is a separate, upcoming effort. uv.lock pins the
# exact resolved commit; a plain `uv sync` prefers that locked commit over the branch's
# latest, so it won't silently pick up new commits. Both track main; bump with
# `uv lock --upgrade-package <name>` when the sibling repo changes and you want the
# update here.
claude-client = { git = "https://github.com/guidodinello/claude-client", branch = "main" }
logger = { git = "https://github.com/guidodinello/logger", branch = "main" }

[project.scripts]
claude-backup = "claude_web_backup.backup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_web_backup"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["claude_web_backup"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "pre-commit>=4.6.1",
]
