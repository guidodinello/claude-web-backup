[project]
name = "claude-web-backup"
version = "0.1.0"
description = "Nightly local backup of Claude.ai projects and conversations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-client",
    "logger",
]

[tool.uv.sources]
claude-client = { path = "/home/guido/projects/claude-client" }
logger = { path = "/home/guido/projects/logger" }

[project.scripts]
claude-backup = "claude_web_backup.backup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_web_backup"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["claude_web_backup"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "pre-commit>=4.6.1",
]
