[project]
name = "claude-web-backup"
version = "0.1.0"
description = "Nightly local backup of Claude.ai projects and conversations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-client",
    "logger",
]

[tool.uv.sources]
# Git sources, not local paths: uv sync needs to resolve these in CI (GitHub Actions
# runners don't have sibling repos checked out), and uv.lock pins the exact resolved
# commit regardless. Both track their main branch; bump with
# `uv lock --upgrade-package <name>` when the sibling repo changes and you want the update.
#
# claude-client is pinned to its chore/git-source-deps branch (guidodinello/claude-client#7)
# until that PR merges — claude-client's own main still has a local-path source for logger,
# which breaks resolution here. Switch back to branch="main" once #7 lands, then re-lock.
claude-client = { git = "https://github.com/guidodinello/claude-client", branch = "chore/git-source-deps" }
logger = { git = "https://github.com/guidodinello/logger", branch = "main" }

[project.scripts]
claude-backup = "claude_web_backup.backup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_web_backup"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["claude_web_backup"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "pre-commit>=4.6.1",
]
